services:
  job-watcher:
    build:
      context: .
    container_name: job-watcher
    restart: unless-stopped
    init: true
    environment:
      JOB_WATCHER_DATA_DIR: /data
      JOB_WATCHER_TIMEZONE: ${JOB_WATCHER_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${JOB_WATCHER_PORT:-17843}:8000"
    volumes:
      - job_watcher_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  job_watcher_data:
    name: job-watcher-data

